<!--
  SALTDOG favicon.

  The anchor is Material Design Icons' `mdiAnchor`, pasted rather than
  hand-drawn: every other icon on this site comes from @mdi/js, so reusing that
  path keeps the tab icon in the same drawing hand as the UI it opens. The
  viewBox is MDI's native 24x24 so the path can be pasted unmodified; the 0.88
  inset is there because at full size the flukes reach x 3 and x 21 and the
  rasterized 16px tile reads as a cropped anchor rather than an anchor. 0.80 was
  also rendered and compared: visibly softer at 16px for no gain in margin.

  Full-bleed tile, no corner radius, on purpose. At the 16px size this is
  actually rasterized to, a 3px radius is mush, and the platforms that want
  rounded corners (iOS, Android) apply their own mask to apple-touch-icon.png
  regardless.

  Colours are literals, not theme tokens, because a favicon is fetched by the
  browser before any CSS runs and cannot see them. Navy is the light theme's
  primary (#0A2E5C) rather than the dark theme's background (#0A1628), which is
  near-black and reads as a smudge against dark browser chrome. Gold is the
  shared accent. The tile is opaque for the same reason: a transparent
  monochrome glyph vanishes into whichever chrome happens to match it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>SALTDOG</title>
  <rect width="24" height="24" fill="#0A2E5C" />
  <g transform="translate(1.44,1.44) scale(0.88)">
    <path
      fill="#C8A951"
      d="M12 2A3 3 0 0 0 9 5A3 3 0 0 0 11 7.83V9H8V11H11V19.92C10.26 19.79 9.5 19.58 8.79 19.27C8.05 18.95 7.4 18.56 6.82 18.09C6.24 17.62 5.78 17.11 5.44 16.55L7 15L3 12V15C3 15.97 3.27 16.88 3.82 17.72C4.37 18.56 5.09 19.31 6 19.95C6.87 20.59 7.84 21.09 8.88 21.45C9.93 21.81 10.97 22 12 22C13.03 22 14.07 21.8 15.12 21.44C16.16 21.08 17.13 20.58 18 19.95C18.92 19.31 19.63 18.57 20.18 17.72C20.73 16.88 21 15.97 21 15V12L17 15L18.56 16.55C18.22 17.11 17.76 17.62 17.18 18.09C16.6 18.56 15.95 18.95 15.21 19.27C14.5 19.58 13.74 19.79 13 19.92V11H16V9H13V7.82A3 3 0 0 0 15 5A3 3 0 0 0 12 2M12 4A1 1 0 0 1 13 5A1 1 0 0 1 12 6A1 1 0 0 1 11 5A1 1 0 0 1 12 4Z"
    />
  </g>
</svg>
